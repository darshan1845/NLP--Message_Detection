<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>predicted output is</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0A0E1A;
            --panel: #121A2B;
            --panel-border: #223049;
            --teal: #2DD4BF;
            --teal-dim: #1B8F82;
            --coral: #FF6B6B;
            --fog: #E7ECF3;
            --mist: #8A93A8;
            --mono: 'IBM Plex Mono', monospace;
            --display: 'Space Grotesk', sans-serif;
            --body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            background: var(--ink);
            color: var(--fog);
            font-family: var(--body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .radar-field {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0.45;
        }

        .radar-rings {
            position: relative;
            width: min(90vmin, 780px);
            height: min(90vmin, 780px);
            border-radius: 50%;
            overflow: hidden;
            background: repeating-radial-gradient(
                circle at center,
                transparent 0,
                transparent 59px,
                rgba(45, 212, 191, 0.12) 60px,
                transparent 61px
            );
            border: 1px solid rgba(45, 212, 191, 0.14);
        }

        .radar-sweep { position: absolute; inset: 0; }
        .radar-sweep::before {
            content: '';
            position: absolute;
            inset: 0;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 300deg,
                rgba(45, 212, 191, 0.30) 340deg,
                rgba(45, 212, 191, 0.55) 358deg,
                transparent 360deg
            );
            animation: sweepRotate 6s linear infinite;
        }

        @keyframes sweepRotate { to { transform: rotate(360deg); } }

        /* ---------- layout ---------- */
        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .masthead {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--mist);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 8px 2px rgba(45, 212, 191, 0.7);
            animation: dotPulse 2s ease-in-out infinite;
        }

        .status-dot.dot-coral {
            background: var(--coral);
            box-shadow: 0 0 8px 2px rgba(255, 107, 107, 0.7);
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        h1 {
            font-family: var(--display);
            font-weight: 600;
            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.15;
            letter-spacing: -0.01em;
        }

        .accent { color: var(--teal); }
        .accent-coral { color: var(--coral); }

        .sub {
            color: var(--mist);
            font-size: 15px;
            max-width: 420px;
            margin: 0 auto;
        }

        /* ---------- console panel ---------- */
        .console {
            position: relative;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%), var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
            animation: panelRise 0.6s ease both;
        }

        @keyframes panelRise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .console::before, .console::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: rgba(45, 212, 191, 0.5);
            border-style: solid;
        }
        .console::before { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
        .console::after { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

        /* ---------- verdict badge ---------- */
        .verdict {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: rgba(255,255,255,0.02);
            margin-bottom: 26px;
        }

        .verdict-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-family: var(--mono);
            flex-shrink: 0;
            background: rgba(255,255,255,0.05);
            color: var(--mist);
        }

        .verdict-label {
            font-family: var(--display);
            font-weight: 600;
            font-size: 17px;
            color: var(--fog);
        }

        .verdict-spam { border-color: rgba(255, 107, 107, 0.45); background: rgba(255, 107, 107, 0.08); }
        .verdict-spam .verdict-icon { background: rgba(255, 107, 107, 0.18); color: var(--coral); box-shadow: 0 0 14px rgba(255, 107, 107, 0.35); }
        .verdict-spam .verdict-label { color: var(--coral); }

        .verdict-safe { border-color: rgba(45, 212, 191, 0.4); background: rgba(45, 212, 191, 0.07); }
        .verdict-safe .verdict-icon { background: rgba(45, 212, 191, 0.16); color: var(--teal); box-shadow: 0 0 14px rgba(45, 212, 191, 0.3); }
        .verdict-safe .verdict-label { color: var(--teal); }

        /* ---------- log readout (original three lines) ---------- */
        .log {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 10px;
        }

        .log-line {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            opacity: 0;
            animation: lineIn 0.45s ease forwards;
        }
        .log-line:last-child { border-bottom: none; }
        .log-line:nth-child(1) { animation-delay: 0.1s; }
        .log-line:nth-child(2) { animation-delay: 0.25s; }
        .log-line:nth-child(3) { animation-delay: 0.4s; }

        @keyframes lineIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-label {
            font-family: var(--mono);
            font-size: 11.5px;
            letter-spacing: 0.08em;
            color: var(--mist);
            text-transform: uppercase;
        }

        .log-value {
            font-family: var(--body);
            font-size: 15.5px;
            color: var(--fog);
            word-break: break-word;
        }

        .scan-btn {
            appearance: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
            margin-top: 8px;
            padding: 14px 20px;
            border-radius: 10px;
            font-family: var(--display);
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.01em;
            color: #08130F;
            background: linear-gradient(120deg, var(--teal) 0%, #6FEFD3 50%, var(--teal) 100%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            box-shadow: 0 8px 24px rgba(45, 212, 191, 0.25);
            transition: background-position .5s ease, transform .15s ease, box-shadow .25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .scan-btn:hover {
            background-position: 100% 0%;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(45, 212, 191, 0.35);
        }

        .scan-btn:active { transform: translateY(0) scale(0.98); }

        .scan-btn:focus-visible {
            outline: 2px solid var(--fog);
            outline-offset: 3px;
        }

        .footnote {
            text-align: center;
            font-family: var(--mono);
            font-size: 11.5px;
            color: #5B6478;
            letter-spacing: 0.03em;
        }

        @media (max-width: 480px) {
            .console { padding: 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .radar-sweep::before, .status-dot, .console, .log-line {
                animation: none !important;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="radar-field" aria-hidden="true">
        <div class="radar-rings">
            <div class="radar-sweep"></div>
        </div>
    </div>

    <main class="wrap">
        <header class="masthead">
            <div class="eyebrow"><span class="status-dot" id="statusDot"></span>SYS.01 &mdash; SCAN COMPLETE</div>
            <h1 id="verdictHeadline">Result</h1>
            <p class="sub">Here's what the classifier found.</p>
        </header>

        <section class="console">
            <div class="verdict verdict-neutral" id="verdictBadge">
                <span class="verdict-icon" id="verdictIcon">•</span>
                <span class="verdict-label" id="verdictLabel">Reading result…</span>
            </div>

            <div class="log">
                <div class="log-line">
                    <span class="log-label">&gt; username</span>
                    <span class="log-value" id="valUsername">{{name}}</span>
                </div>
                <div class="log-line">
                    <span class="log-label">&gt; given message is</span>
                    <span class="log-value" id="valMessage">{{msg}}</span>
                </div>
                <div class="log-line">
                    <span class="log-label">&gt; the message is</span>
                    <span class="log-value" id="valResult">{{res}}</span>
                </div>
            </div>

            <a href="/" class="scan-btn">Scan another message →</a>
        </section>

        <footer class="footnote">Analysis runs through a trained NLP classification model.</footer>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', function () {
            var resultEl = document.getElementById('valResult');
            var raw = resultEl ? resultEl.textContent.trim() : '';
            var lower = raw.toLowerCase();

            var isSpam = lower.indexOf('spam') !== -1 && lower.indexOf('not spam') === -1;
            var isSafe = !isSpam && (lower.indexOf('ham') !== -1 || lower.indexOf('not spam') !== -1);

            var badge = document.getElementById('verdictBadge');
            var icon = document.getElementById('verdictIcon');
            var label = document.getElementById('verdictLabel');
            var headline = document.getElementById('verdictHeadline');
            var dot = document.getElementById('statusDot');

            if (isSpam) {
                badge.classList.remove('verdict-neutral');
                badge.classList.add('verdict-spam');
                icon.textContent = '⚠';
                label.textContent = raw || 'Spam detected';
                headline.innerHTML = 'Flagged as <span class="accent-coral">spam</span>';
                dot.classList.add('dot-coral');
            } else if (isSafe) {
                badge.classList.remove('verdict-neutral');
                badge.classList.add('verdict-safe');
                icon.textContent = '✓';
                label.textContent = raw || 'Looks safe';
                headline.innerHTML = 'Looks like <span class="accent">signal</span>';
            } else {
                icon.textContent = '•';
                label.textContent = raw || 'Result';
                headline.textContent = 'Result';
            }
        });
    </script>
</body>
</html>
